name: V3 Admin Menu Patch

on:
  push:
    branches: [buxena-v3]
    paths:
      - '.github/workflows/v3-admin-menu.yml'

permissions:
  contents: write

jobs:
  patch-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: buxena-v3
      - name: Add V3 pricing tools to admin navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/layouts/AdminLayout.astro')
          s = p.read_text()
          old = "  { href: '/admin/suppliers', label: 'Suppliers', icon: 'suppliers' },\n  { href: '/admin/catalog-status', label: 'Catalog Status', icon: 'products' },"
          new = "  { href: '/admin/suppliers', label: 'Suppliers', icon: 'suppliers' },\n  { href: '/admin/supplier-pricing', label: 'Supplier Pricing', icon: 'suppliers' },\n  { href: '/admin/competitor-pricing', label: 'Competitor Pricing', icon: 'analytics' },\n  { href: '/admin/pricing-lab', label: 'Pricing Lab', icon: 'reports' },\n  { href: '/admin/catalog-status', label: 'Catalog Status', icon: 'products' },"
          if new in s:
              raise SystemExit(0)
          if old not in s:
              raise SystemExit('Expected admin navigation anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit menu update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "BUXENA V3 automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/layouts/AdminLayout.astro
          git commit -m "V3: add pricing tools to admin sidebar"
          git push origin HEAD:buxena-v3

# Automated verification for the V2 branch.
#
# Runs the same four gates a person would run by hand — build, type check,
# unit tests, pre-launch board — on every push and pull request touching
# buxena-v2. It only ever reads and builds: nothing here deploys, publishes,
# or touches `main` / V1.
name: Verify

on:
  push:
    branches: [buxena-v2]
  pull_request:
    branches: [buxena-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      # Keep the exact output as an artifact as well as in the log. This makes
      # a failing draft PR diagnosable without ever adding secrets or touching
      # production, and can stay useful for future regressions.
      - name: Unit tests
        id: unit_tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee unit-test-output.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload unit-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-diagnostics
          path: unit-test-output.txt
          if-no-files-found: error

      - name: Fail on unit-test errors
        if: steps.unit_tests.outputs.exit_code != '0'
        run: exit 1

      - name: Pre-launch board
        id: prelaunch
        shell: bash
        run: |
          set +e
          npm run prelaunch 2>&1 | tee prelaunch-output.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload pre-launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prelaunch-diagnostics
          path: prelaunch-output.txt
          if-no-files-found: error

      - name: Fail on pre-launch errors
        if: steps.prelaunch.outputs.exit_code != '0'
        run: exit 1
